<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="images/illustrations/hero-ghoster.png">
  <meta name="description"
    content="Movie Kings : reconnais la réplique, trouve le film et grimpe au classement pour gagner des places de cinéma.">
  <title>Movie Kings : deviens le roi de la réplique</title>
  <link rel="stylesheet" href="styles/main.min.css">
</head>

<body>
  <!-- En-tête -->
  <header class="header">
    <a class="header__logo" href="index.html">
      <picture>
        <source srcset="images/logo/logo-full.svg">
        <img class="header__logo-image" src="images/logo/logo-mk.svg" alt="Movie Kings, accueil">
      </picture>
    </a>

    <!-- Burger -->
    <button class="header__burger" type="button" aria-label="Menu">
      <img class="header__burger-icon" src="images/icons/burger.svg" alt="">
    </button>

    <nav class="nav header__nav" aria-label="Navigation principale">
      <ul class="nav__list">
        <li class="nav__item">
          <a class="nav__link" href="index.html" aria-current="page">
            <img class="nav__icon" src="images/icons/nav-home.svg" alt="">
            Accueil
          </a>
        </li>
        <li class="nav__item">
          <a class="nav__link nav__link--active" href="#jouer">
            <img class="nav__icon" src="images/icons/nav-play.svg" alt="">
            Jouer
          </a>
        </li>
        <li class="nav__item">
          <a class="nav__link" href="#categories">
            <img class="nav__icon" src="images/icons/nav-ranking.svg" alt="">
            Classement
          </a>
        </li>
      </ul>
    </nav>

    <nav class="lang-switch header__lang" aria-label="Choix de la langue">
      <ul class="lang-switch__list">
        <li class="lang-switch__item">
          <a class="lang-switch__link lang-switch__link--active" href="index.html" hreflang="fr" lang="fr"
            aria-current="true">
            <abbr class="lang-switch__abbr" title="Français">FR</abbr>
          </a>
        </li>
        <li class="lang-switch__item">
          <a class="lang-switch__link" href="index.html" hreflang="en" lang="en">
            <abbr class="lang-switch__abbr" title="English">EN</abbr>
          </a>
        </li>
        <li class="lang-switch__item">
          <a class="lang-switch__link" href="index.html" hreflang="de" lang="de">
            <abbr class="lang-switch__abbr" title="Deutsch">DE</abbr>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p class="footer__brand">
      <img class="footer__logo" src="images/logo/logo-mk.svg" width="140" height="85" alt="Movie Kings">
      <small class="footer__copyright">© 2027 Movie Kings</small>
    </p>

    <ul class="footer__socials" aria-label="Réseaux et communautés">
      <li class="footer__social-item">
        <a class="footer__social-link" href="https://www.instagram.com/" target="_blank" rel="noopener">
          Instagram<span class="visually-hidden"></span>
        </a>
      </li>
      <li class="footer__social-item">
        <a class="footer__social-link" href="https://www.tiktok.com/" target="_blank" rel="noopener">
          TikTok<span class="visually-hidden"></span>
        </a>
      </li>
      <li class="footer__social-item">
        <a class="footer__social-link" href="https://www.youtube.com/" target="_blank" rel="noopener">
          YouTube<span class="visually-hidden"></span>
        </a>
      </li>
      <li class="footer__social-item">
        <a class="footer__social-link" href="https://discord.com/" target="_blank" rel="noopener">
          Discord<span class="visually-hidden"></span>
        </a>
      </li>
    </ul>
  </footer>

</body>

</html>
